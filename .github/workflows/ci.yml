name: Pruebas
#Cuando se hace un push a la rama development o main, o cuando se hace un pull request a esas ramas, se ejecuta este workflow para correr las pruebas del proyecto.
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest #Utiliza una maquina virtual con Ubuntu como sistema operativo para ejecutar el trabajo.
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar uv y seleccionar Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.8"
          python-version: "3.15.2"

      - name: Instalar dependencias
        run: uv sync --locked # Verifica el lock e instala sus versiones.

      - name: Preparar archivos estáticos
        run: uv run --locked python manage.py collectstatic --noinput # Reúne los estáticos en STATIC_ROOT y prepara el manifiesto.

      - name: Ejecutar pruebas
        run: uv run --locked python manage.py test -v 2

    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "A0MIUW7mmC5Ld2q_wxD-dvjbiQBMccJqgPYI99IEMpCvZxA8yP097mK8Pf0fMxmeOxyd-bLO6YEdczbpVe1S5g"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
